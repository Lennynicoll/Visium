version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: visium-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: RegistroVisitantesDb
      MYSQL_USER: visium_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: visium-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=db;Port=3306;Database=RegistroVisitantesDb;User=visium_user;Password=${MYSQL_PASSWORD};"
      CORS__Origins: ${CORS_ORIGINS}
      MySQL__ServerVersion: "8.0.0-mysql"
    ports:
      - "8080:8080"

volumes:
  db_data:
