services:
  db:
    image: mysql:8.0
    container_name: visium-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: RegistroVisitantesDb
      MYSQL_USER: visium_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app-internal

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: visium-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=db;Port=3306;Database=RegistroVisitantesDb;User=visium_user;Password=${MYSQL_PASSWORD};"
      CORS__Origins: ${CORS_ORIGINS:?CORS_ORIGINS must be set}
      MySQL__ServerVersion: "8.0.0-mysql"
    networks:
      - app-internal
      - proxy-net
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy-net
      traefik.http.routers.visium-api.rule: "Host(`api-lenny-visium.opticredit.app`)"
      traefik.http.routers.visium-api.entrypoints: websecure
      traefik.http.routers.visium-api.tls.certresolver: exonoor
      traefik.http.services.visium-api.loadbalancer.server.port: "8080"

volumes:
  db_data:

networks:
  app-internal:
    driver: bridge
    internal: true

  proxy-net:
    external: true
