services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: visium-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD must be set}
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\" -C || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
    networks:
      - app-internal

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: visium-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=RegistroVisitantesDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;"
      CORS__Origins: ${CORS_ORIGINS:?CORS_ORIGINS must be set}
    networks:
      - app-internal
      - proxy-net
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy-net
      traefik.http.routers.visium-api.rule: "Host(`api-lenny-visium.opticredit.app`)"
      traefik.http.routers.visium-api.entrypoints: websecure
      traefik.http.routers.visium-api.tls.certresolver: exonoor
      traefik.http.services.visium-api.loadbalancer.server.port: "8080"

volumes:
  sqlserver_data:

networks:
  app-internal:
    driver: bridge
    internal: true

  proxy-net:
    external: true
